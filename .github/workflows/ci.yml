name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - name: Check secure filesystem runtime
        run: python3 -c "import sys; assert sys.version_info >= (3, 10), 'Python 3.10 or newer required'"
      - name: Prepare pinned GitHub release dependencies
        run: node scripts/bootstrap.mjs --allow-network
      - run: npm ci --ignore-scripts --prefer-offline
      - run: npm run build
      - run: npm test
      - run: npm pack --ignore-scripts
      - name: Retrieve pinned public test image
        if: runner.os == 'Linux' && matrix.node == 22
        run: docker pull node:22-slim@sha256:43ac6c60b8f89723f746e8a92ce91abd5017e627ce1ddfe4238355d3a30b772c
      - name: Run isolated Docker acceptance
        if: runner.os == 'Linux' && matrix.node == 22
        run: npm run test:container
